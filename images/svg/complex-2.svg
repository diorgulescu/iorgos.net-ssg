<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%" style="background-color: #FAFAFA;">
    
    <!-- Background Grid -->
    <defs>
        <pattern id="grid_c2" width="15" height="15" patternUnits="userSpaceOnUse">
            <path d="M 15 0 L 0 0 0 15" fill="none" stroke="#E2E8F0" stroke-width="1"/>
        </pattern>
    </defs>
    <rect width="300" height="300" fill="url(#grid_c2)" />

    <!-- Ground Level -->
    <line x1="20" y1="240" x2="280" y2="240" stroke="#CBD5E0" stroke-width="2" stroke-linecap="square"/>

    <!-- Lactic Accumulation Ladder (10-8-5-3-2-1 Proportional Bar Chart) -->
    <g stroke="#E2E8F0" stroke-width="8" stroke-linecap="square">
        <line x1="200" y1="240" x2="200" y2="140"/> <!-- 10 -->
        <line x1="215" y1="240" x2="215" y2="160"/> <!-- 8 -->
        <line x1="230" y1="240" x2="230" y2="190"/> <!-- 5 -->
        <line x1="245" y1="240" x2="245" y2="210"/> <!-- 3 -->
        <line x1="260" y1="240" x2="260" y2="220"/> <!-- 2 -->
        <line x1="275" y1="240" x2="275" y2="230"/> <!-- 1 -->
    </g>

    <!-- Continuous Tension Vector (Red Line) -->
    <polyline points="200,140 215,160 230,190 245,210 260,220 275,230" fill="none" stroke="#D9381E" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="200" cy="140" r="3.5" fill="#D9381E"/>
    <circle cx="275" cy="230" r="3.5" fill="#D9381E"/>

    <!-- Technical Kettlebell Blueprint -->
    <g stroke-linecap="square">
        <!-- Structural Axes -->
        <line x1="110" y1="40" x2="110" y2="260" stroke="#CBD5E0" stroke-dasharray="5 5" stroke-width="1.5"/>
        <line x1="30" y1="185" x2="190" y2="185" stroke="#CBD5E0" stroke-dasharray="5 5" stroke-width="1.5"/>
        
        <!-- Kettlebell Handle -->
        <path d="M 70 135 v-25 a 40 40 0 0 1 80 0 v25" fill="none" stroke="#2D3748" stroke-width="14"/>
        
        <!-- Kettlebell Body -->
        <circle cx="110" cy="185" r="50" fill="#FAFAFA" stroke="#2D3748" stroke-width="8"/>
        
        <!-- Kettlebell Base -->
        <path d="M 75 236 h 70" fill="none" stroke="#2D3748" stroke-width="10"/>
        
        <!-- Center of Mass Target -->
        <circle cx="110" cy="185" r="5" fill="#2D3748"/>
        <circle cx="110" cy="185" r="14" fill="none" stroke="#2D3748" stroke-width="2"/>
    </g>

    <!-- Unbroken Loop Indicator (Red Circular Arrow above handle) -->
    <path d="M 110 55 A 30 30 0 1 1 80 85" fill="none" stroke="#D9381E" stroke-width="2.5" stroke-dasharray="4 4"/>
    <!-- Arrow Head -->
    <polygon points="76,82 86,88 81,76" fill="#D9381E"/>

    <!-- Technical Labels -->
    <text x="15" y="285" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#718096" font-weight="600">CPLX_02 // LACTIC_CAPACITY</text>
    <text x="15" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8" fill="#718096" letter-spacing="1">UNBROKEN_LOOP</text>
    
    <text x="195" y="125" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#D9381E" font-weight="700">10-8-5-3-2-1</text>
    <text x="195" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="7" fill="#718096" letter-spacing="1">DESCENDING_LADDER</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%" style="background-color: #FAFAFA;">
    
    <!-- Background Grid -->
    <defs>
        <pattern id="grid_c1" width="15" height="15" patternUnits="userSpaceOnUse">
            <path d="M 15 0 L 0 0 0 15" fill="none" stroke="#E2E8F0" stroke-width="1"/>
        </pattern>
    </defs>
    <rect width="300" height="300" fill="url(#grid_c1)" />

    <!-- Ground Level -->
    <line x1="30" y1="260" x2="270" y2="260" stroke="#CBD5E0" stroke-width="2" stroke-linecap="square"/>

    <!-- Vertical Force Vector (Gravity / Tension Line) -->
    <line x1="160" y1="20" x2="160" y2="280" stroke="#D9381E" stroke-width="2" stroke-dasharray="6 4"/>
    
    <!-- Thoracic Rotation Angle -->
    <path d="M 160 120 A 40 40 0 0 0 130 120" fill="none" stroke="#D9381E" stroke-width="2"/>
    <!-- Small arrow head for rotation -->
    <polygon points="128,124 135,125 131,118" fill="#D9381E"/>

    <!-- Biomechanical Figure (Anthracite Lines) -->
    <g stroke="#2D3748" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
        <!-- Left Leg -->
        <line x1="110" y1="260" x2="180" y2="180"/>
        <!-- Right Leg -->
        <line x1="210" y1="260" x2="180" y2="180"/>
        <!-- Spine (Hinged) -->
        <line x1="180" y1="180" x2="130" y2="120"/>
        <!-- Shoulder Axis -->
        <line x1="100" y1="150" x2="160" y2="90"/>
        <!-- Bottom Arm (Reaching down) -->
        <line x1="100" y1="150" x2="110" y2="240"/>
        <!-- Top Arm (Vertical Lockout) -->
        <line x1="160" y1="90" x2="160" y2="40"/>
    </g>

    <!-- Articulations / Joints -->
    <g fill="#FAFAFA" stroke="#2D3748" stroke-width="3">
        <circle cx="180" cy="180" r="5"/> <!-- Hips -->
        <circle cx="130" cy="120" r="5"/> <!-- Thoracic center -->
        <circle cx="100" cy="150" r="5"/> <!-- Bottom Shoulder -->
        <circle cx="160" cy="90" r="5"/> <!-- Top Shoulder -->
        <circle cx="110" cy="240" r="4"/> <!-- Bottom Hand -->
        <circle cx="110" cy="260" r="4"/> <!-- Left Foot -->
        <circle cx="210" cy="260" r="4"/> <!-- Right Foot -->
        <circle cx="160" cy="40" r="4"/> <!-- Top Hand -->
    </g>

    <!-- Kettlebell -->
    <path d="M 152 24 C 152 14, 168 14, 168 24 Z" fill="none" stroke="#2D3748" stroke-width="3"/>
    <circle cx="160" cy="24" r="10" fill="#2D3748"/>

    <!-- Technical Labels -->
    <text x="15" y="285" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#718096" font-weight="600">CPLX_01 // STRUCTURAL</text>
    <text x="215" y="285" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#718096">TUT: MAX</text>
    
    <!-- Measurement / Dimension Lines -->
    <line x1="240" y1="40" x2="240" y2="260" stroke="#CBD5E0" stroke-width="1"/>
    <line x1="235" y1="40" x2="245" y2="40" stroke="#CBD5E0" stroke-width="1"/>
    <line x1="235" y1="260" x2="245" y2="260" stroke="#CBD5E0" stroke-width="1"/>
    <text x="245" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" fill="#A0AEC0" transform="rotate(270 245,180)" letter-spacing="2">LOCKOUT</text>
</svg>

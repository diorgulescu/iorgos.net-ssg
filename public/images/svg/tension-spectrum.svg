<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" style="background-color: #FAFAFA;">
    
    <!-- Background Technical Grid -->
    <defs>
        <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
            <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#E2E8F0" stroke-width="1"/>
        </pattern>
    </defs>
    <rect width="500" height="500" fill="url(#grid)" />

    <!-- Center Crosshairs / Structural Axes -->
    <path d="M 250 50 V 450 M 50 290 H 450" fill="none" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="10 5"/>

    <!-- Kettlebell Handle -->
    <path d="M180,220 v-50 a70,70 0 0,1 140,0 v50" fill="none" stroke="#2D3748" stroke-width="32" stroke-linecap="square"/>
    
    <!-- Kettlebell Body (Filled with off-white to block the internal grid) -->
    <circle cx="250" cy="290" r="90" fill="#FAFAFA" stroke="#2D3748" stroke-width="32"/>
    
    <!-- Kettlebell Flat Base -->
    <path d="M190,380 h120" fill="none" stroke="#2D3748" stroke-width="32" stroke-linecap="square"/>
    
    <!-- Center Target Point -->
    <path d="M 240 290 H 260 M 250 280 V 300" fill="none" stroke="#2D3748" stroke-width="3"/>

    <!-- Tension Force Vector (The 'Spectrum' line) -->
    <polyline points="50,290 140,290 200,130 250,370 300,130 360,290 450,290" fill="none" stroke="#D9381E" stroke-width="8" stroke-linejoin="miter" stroke-linecap="square"/>
    
    <!-- Tension Nodes / Focal Points -->
    <circle cx="140" cy="290" r="6" fill="#D9381E" stroke="#FAFAFA" stroke-width="2" />
    <circle cx="200" cy="130" r="6" fill="#D9381E" stroke="#FAFAFA" stroke-width="2" />
    <circle cx="250" cy="370" r="6" fill="#D9381E" stroke="#FAFAFA" stroke-width="2" />
    <circle cx="300" cy="130" r="6" fill="#D9381E" stroke="#FAFAFA" stroke-width="2" />
    <circle cx="360" cy="290" r="6" fill="#D9381E" stroke="#FAFAFA" stroke-width="2" />

    <!-- Technical Blueprint Labels -->
    <text x="50" y="460" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#718096" letter-spacing="2" font-weight="600">TENSION_SPECTRUM // FIG. 01</text>
    <text x="390" y="460" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#718096" letter-spacing="1">AXIS: Y</text>
</svg>
